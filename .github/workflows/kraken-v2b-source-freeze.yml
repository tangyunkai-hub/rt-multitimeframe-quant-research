name: kraken-v2b-source-freeze
on:
  push:
    branches: [kraken-v2b-source-freeze-20260919]
    paths: ['.github/workflows/kraken-v2b-source-freeze.yml']
permissions:
  contents: write
jobs:
  freeze-source:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kraken-v2b-source-freeze-20260919
          fetch-depth: 0
      - name: Acquire official Kraken complete OHLCVT archive sequentially and verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/broad_cycle1/kraken_v2b_source
          cd research/broad_cycle1/kraken_v2b_source
          BASE='https://assets.kraken.com/marketing/institutions'
          curl -fL --retry 5 --retry-delay 10 -o PARTS_SHA256SUMS.txt "$BASE/OHLCVT_Full_PARTS_SHA256SUMS.txt"
          : > Kraken_OHLCVT_Full_2026Q2.zip
          for i in 00 01 02 03 04; do
            f="Kraken_OHLCVT_Full_2026Q2.zip.part${i}"
            curl -fL --retry 5 --retry-delay 10 -o "$f" "$BASE/$f"
            expected=$(grep -E "[[:space:]]${f}$" PARTS_SHA256SUMS.txt | awk '{print $1}' | tail -1)
            test -n "$expected"
            actual=$(sha256sum "$f" | awk '{print $1}')
            test "$actual" = "$expected"
            cat "$f" >> Kraken_OHLCVT_Full_2026Q2.zip
            rm -f "$f"
          done
          echo 'fc81b54cba6e12af3e9422dde9416179e6ef76af4831d48d839fbdb43018eaa4  Kraken_OHLCVT_Full_2026Q2.zip' | sha256sum -c -
      - name: Locate and extract BTC/USD 1440m only
        shell: bash
        run: |
          set -euo pipefail
          cd research/broad_cycle1/kraken_v2b_source
          unzip -Z1 Kraken_OHLCVT_Full_2026Q2.zip > archive_inventory.txt
          match=$(grep -Ei '(^|/)(XBTUSD|BTCUSD)[^/]*_1440\.csv$' archive_inventory.txt | head -1 || true)
          if [ -z "$match" ]; then
            echo 'No BTC/USD 1440m member found. Candidate names:'
            grep -Ei '(XBTUSD|BTCUSD).*1440' archive_inventory.txt | head -50 || true
            exit 2
          fi
          printf '%s\n' "$match" > selected_member.txt
          unzip -p Kraken_OHLCVT_Full_2026Q2.zip "$match" > kraken_btcusd_1440_raw.csv
          rm -f Kraken_OHLCVT_Full_2026Q2.zip
      - name: Normalize frozen overlap and audit without performance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('research/broad_cycle1/kraken_v2b_source')
          raw=p/'kraken_btcusd_1440_raw.csv'
          start=datetime(2019,9,8,tzinfo=timezone.utc).timestamp()
          end=datetime(2023,1,1,tzinfo=timezone.utc).timestamp()
          rows=[]
          with raw.open(newline='') as f:
            for r in csv.reader(f):
              if len(r)<7: continue
              ts=float(r[0])
              if start <= ts < end:
                o,h,l,c=map(float,r[1:5])
                if min(o,h,l,c)<=0 or h<max(o,l,c) or l>min(o,h,c): raise SystemExit('OHLC envelope failure')
                rows.append((int(ts),r[1],r[2],r[3],r[4],r[5],r[6]))
          if not rows: raise SystemExit('No frozen-overlap rows')
          ts=[x[0] for x in rows]
          if len(ts)!=len(set(ts)) or ts!=sorted(ts): raise SystemExit('duplicate/nonmonotonic timestamps')
          out=p/'kraken_btcusd_1440_frozen_20190908_20221231.csv'
          with out.open('w',newline='') as f:
            w=csv.writer(f,lineterminator='\n'); w.writerow(['timestamp','open','high','low','close','volume','trades']); w.writerows(rows)
          sha=lambda q: hashlib.sha256(q.read_bytes()).hexdigest()
          dates=[datetime.fromtimestamp(t,timezone.utc).date() for t in ts]
          gaps=[]
          for a,b in zip(dates,dates[1:]):
            d=(b-a).days
            if d>1: gaps.append({'after':str(a),'before':str(b),'missing_days':d-1})
          manifest={
            'source':'Kraken official downloadable OHLCVT complete archive through 2026-06-30',
            'source_url':'https://assets.kraken.com/marketing/institutions/Kraken_OHLCVT_Full_2026Q2.zip.part00..part04',
            'assembled_archive_sha256':'fc81b54cba6e12af3e9422dde9416179e6ef76af4831d48d839fbdb43018eaa4',
            'selected_member':(p/'selected_member.txt').read_text().strip(),
            'raw_member_sha256':sha(raw),
            'normalized_sha256':sha(out),
            'rows':len(rows),'unique_timestamps':len(set(ts)),
            'first_utc':datetime.fromtimestamp(ts[0],timezone.utc).isoformat(),
            'last_utc':datetime.fromtimestamp(ts[-1],timezone.utc).isoformat(),
            'calendar_gaps':gaps,
            'interpolation':False,'performance_computed':False
          }
          (p/'kraken_v2b_source_manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          print(json.dumps(manifest,indent=2))
          PY
      - name: Persist source freeze only
        shell: bash
        run: |
          set -euo pipefail
          cd research/broad_cycle1/kraken_v2b_source
          rm -f kraken_btcusd_1440_raw.csv archive_inventory.txt PARTS_SHA256SUMS.txt
          cd ../../..
          git config user.name 'rt-quant-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/broad_cycle1/kraken_v2b_source
          git commit -m 'Freeze official Kraken V2b BTCUSD daily source' || exit 0
          git push origin HEAD:kraken-v2b-source-freeze-20260919
