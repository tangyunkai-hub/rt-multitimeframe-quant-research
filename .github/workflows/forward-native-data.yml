name: forward-native-data

on:
  workflow_dispatch:
    inputs:
      end_date:
        description: 'Inclusive UTC source day YYYY-MM-DD; blank = yesterday UTC'
        required: false
        type: string
      mode:
        description: 'monitor = bounded overlap; full = complete frozen-forward rebuild'
        required: false
        default: monitor
        type: choice
        options: [monitor, full]
  schedule:
    - cron: '25 3 * * *'
  push:
    paths:
      - 'tools/download_forward_native_data.py'
      - 'tools/download_forward_bitstamp_state.py'
      - '.github/workflows/forward-native-data.yml'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas
      - name: Collect post-freeze Binance native data and Bitstamp state-only data
        shell: bash
        run: |
          MODE="${{ inputs.mode }}"; [ -z "$MODE" ] && MODE=monitor
          ARGS=(--out forward_native_data --mode "$MODE")
          if [ -n "${{ inputs.end_date }}" ]; then ARGS+=(--end-date "${{ inputs.end_date }}"); fi
          python tools/download_forward_native_data.py "${ARGS[@]}"
          python tools/download_forward_bitstamp_state.py "${ARGS[@]}"
      - name: Show data-only gates
        if: always()
        run: |
          cat forward_native_data/DATA_GATE.json || true
          cat forward_native_data/integrity.csv || true
          cat forward_native_data/bitstamp/DATA_GATE.json || true
          cat forward_native_data/bitstamp/integrity.csv || true
      - name: Enforce data-only and state-only gates
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          allowed={'PASS','PASS_WITH_EXPECTED_EARLY_WAITING_INTERVALS','WAITING_NO_COMPLETED_POST_FREEZE_UTC_DAY','WAITING_SOURCE_ARCHIVE_PUBLICATION','WAITING_FIRST_COMPLETED_STATE_BAR'}
          for rel in ('DATA_GATE.json','bitstamp/DATA_GATE.json'):
              p=Path('forward_native_data')/rel
              if not p.exists(): raise SystemExit(f'{rel} missing')
              g=json.loads(p.read_text())
              if g.get('status') not in allowed: raise SystemExit(f'{rel} rejected status {g.get("status")!r}')
              if g.get('performance_evaluation_allowed') is not False: raise SystemExit(f'{rel} performance embargo failed')
              if g.get('candidate_b_judgement_allowed') is not False: raise SystemExit(f'{rel} Candidate B embargo failed')
          b=json.loads((Path('forward_native_data')/'bitstamp'/'DATA_GATE.json').read_text())
          if b.get('state_only') is not True or b.get('price_pnl_use_allowed') is not False:
              raise SystemExit('Bitstamp must remain state-only and excluded from PnL')
          print('forward source gates accepted')
          PY
      - name: Upload forward data-only artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rt-forward-native-data
          path: forward_native_data
          retention-days: 30
          compression-level: 6
