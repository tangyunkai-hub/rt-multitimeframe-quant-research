name: broad-cycle1-data
on:
  push:
    branches: [broad-cycle1-data-20260917]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  freeze-cycle2-runner-hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Persist exact Cycle-2 runner SHA256 only
        run: |
          cd research/broad_cycle2
          sha256sum run_cycle2_frozen.py > run_cycle2_frozen.sha256
          cd ../..
          git config user.name 'rt-quant-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/broad_cycle2/run_cycle2_frozen.sha256
          if git diff --cached --quiet; then echo 'Runner SHA already exact'; else git commit -m 'Correctly freeze exact Cycle-2 runner SHA256'; git push origin HEAD:broad-cycle1-data-20260917; fi
