name: cross-exchange-history

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/download_cross_exchange_coinbase.py"
      - ".github/workflows/cross-exchange-history.yml"
      - "research/cross_exchange_execution_prereg_2026-09-12.md"

jobs:
  coinbase-history:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install data dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests
      - name: Download and integrity-gate Coinbase BTC/ETH 15m history
        run: |
          python tools/download_cross_exchange_coinbase.py \
            --out-dir cross_exchange_coinbase \
            --start 2017-08-17T00:00:00Z \
            --end 2023-01-01T00:00:00Z
      - name: Enforce data-only gate
        run: |
          python - <<'PY'
          import json
          p = json.load(open('cross_exchange_coinbase/DATA_GATE.json'))
          assert p['status'] == 'PASS', p
          assert p['performance_evaluation_allowed'] is False, p
          assert p['classification'] == 'CROSS_EXCHANGE_EXECUTION_ROBUSTNESS_NOT_PROSPECTIVE', p
          print('cross-exchange data-only gate: PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rt-cross-exchange-coinbase-2017-2022
          path: cross_exchange_coinbase/
          if-no-files-found: error
          retention-days: 30
