[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtquant-public"
version = "0.1.0rc2"
description = "Public-safe quantitative research architecture portfolio with causal state machines and prospective validation"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
rtquant-paper = "rtquant.paper.cli:main"
rtquant-prospective-gate = "rtquant.validation.cli:main"
rtquant-prospective-contract = "rtquant.repro.contract_cli:main"
rtquant-prospective-intake = "rtquant.intake.cli:main"

[project.urls]
Homepage = "https://github.com/tangyunkai-hub/rt-multitimeframe-quant-research"
Repository = "https://github.com/tangyunkai-hub/rt-multitimeframe-quant-research"
Issues = "https://github.com/tangyunkai-hub/rt-multitimeframe-quant-research/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
